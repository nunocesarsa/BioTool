[project]
name = "biotool"
version = "0.5.0"
description = "Local, CPU-based multi-model bioacoustics processing tool with a desktop interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "soundfile>=0.12",
    "scikit-maad>=1.4",
    "tensorflow>=2.16,<2.22",
    "kagglehub>=0.3",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.4",
    "sounddevice>=0.4.6",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Optional PyTorch models. Both extras share one torch stack, so they can be installed together:
#   InstallDeepForestSound.bat / uv sync --extra dfs
#   InstallBirdCODE.bat        / uv sync --extra birdcode
# DeepForestSound (African forest species). Its code is downloaded at runtime (CC BY-NC-SA) and
# patched in memory for timm 1.x.
dfs = [
    "torch>=2.6,<2.12",
    "torchaudio>=2.6,<2.12",
    "timm>=1.0.15",
    "peft==0.10.0",
    "transformers>=4.50,<5",
    "wget>=3.2",
]
# BirdCODE zero-shot bird sound event detection (Earth Species Project, MIT code; weights from Hugging Face).
# Not on PyPI: pinned to a commit of github.com/earthspecies/sound-event-detection.
birdcode = [
    "torch>=2.6,<2.12",
    "torchaudio>=2.6,<2.12",
    "transformers>=4.50,<5",
    "librosa>=0.10",
    "huggingface-hub>=0.20",
    "sound-event-detection @ https://github.com/earthspecies/sound-event-detection/archive/617c6408fdd1b56c3873ef2d17006ffbaee61783.zip",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
biotool = "biotool.cli:main"

[project.gui-scripts]
biotool-gui = "biotool.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# librosa -> numba: older numba has no cp312 wheels (same floor as sound-event-detection).
# torch / torchaudio / torchvision must be released together: a mismatched pair fails to load
# ("undefined symbol" / "torchvision::nms does not exist"). Tested set: 2.11.0 / 2.11.0 / 0.26.0.
constraint-dependencies = ["numba>=0.64", "torch==2.11.0", "torchaudio==2.11.0", "torchvision==0.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/biotool"]
