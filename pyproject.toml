[project]
name = "biotool"
version = "0.3.0"
description = "Local, CPU-based multi-model bioacoustics processing tool with a desktop interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "soundfile>=0.12",
    "scikit-maad>=1.4",
    "tensorflow>=2.16,<2.22",
    "kagglehub>=0.3",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.4",
    "sounddevice>=0.4.6",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
biotool = "biotool.cli:main"

[project.gui-scripts]
biotool-gui = "biotool.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biotool"]
